<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
  content="width=device-width, initial-scale=1.0">

  <title>Social Feed Online</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial,sans-serif;
    }

    body{
      background:#111;
      color:white;
    }

    .container{
      max-width:500px;
      margin:auto;
      padding:20px;
    }

    h1{
      text-align:center;
      margin-bottom:20px;
      margin-top:20px;
      font-size:45px;
    }

    input, textarea{
      width:100%;
      padding:12px;
      margin-top:10px;
      border:none;
      border-radius:10px;
      outline:none;
      font-size:16px;
    }

    textarea{
      resize:none;
      height:120px;
    }

    button{
      width:100%;
      padding:12px;
      margin-top:10px;
      border:none;
      border-radius:10px;
      background:#00bcd4;
      color:white;
      font-size:18px;
      cursor:pointer;
    }

    .admin-box{
      background:#222;
      padding:15px;
      border-radius:15px;
      margin-bottom:20px;
      border:1px solid #444;
    }

    .post{
      background:#222;
      padding:15px;
      border-radius:15px;
      margin-top:15px;
      animation:muncul .4s ease;
    }

    @keyframes muncul{

      from{
        opacity:0;
        transform:translateY(20px);
      }

      to{
        opacity:1;
        transform:translateY(0);
      }

    }

    .post-user{
      color:#00bcd4;
      font-size:20px;
      margin-bottom:10px;
      font-weight:bold;
    }

    .like{
      margin-top:10px;
      cursor:pointer;
      user-select:none;
      font-size:20px;
    }

    .comment{
      background:#333;
      padding:8px;
      border-radius:8px;
      margin-top:8px;
    }

    .comment-user{
      color:#00bcd4;
      font-size:14px;
    }

  </style>
</head>

<body>

<div class="container">

  <h1>Social Feed Online</h1>

  <!-- ADMIN -->
  <div class="admin-box" id="adminBox">

    <h2>Admin Post</h2>

    <textarea
    id="postInput"
    placeholder="Tulis sesuatu..."
    ></textarea>

    <button onclick="addPost()">
      Post
    </button>

  </div>

  <!-- FEED -->
  <div id="feed"></div>

</div>

<script type="module">

import {
  initializeApp
}
from
"https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

import {
  getFirestore,
  collection,
  addDoc,
  onSnapshot,
  query,
  orderBy,
  updateDoc,
  doc,
  arrayUnion
}
from
"https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";


// FIREBASE CONFIG
const firebaseConfig = {

  apiKey: "AIzaSyA0nxd_RaK5iGpuYI9U93byYpxzNUrLoB8",

  authDomain: "my-wibe.firebaseapp.com",

  projectId: "my-wibe",

  storageBucket: "my-wibe.firebasestorage.app",

  messagingSenderId: "142370635667",

  appId: "1:142370635667:web:38cf62dd2be96c57deb266"

};

// CONNECT FIREBASE
const app =
initializeApp(firebaseConfig);

const db =
getFirestore(app);


// AMBIL DATA LOGIN
const role =
localStorage.getItem("role");

const username =
localStorage.getItem("username");


// ELEMENT
const adminBox =
document.getElementById("adminBox");

const feed =
document.getElementById("feed");


// CEK LOGIN
if(!role){

  window.location.href =
  "index.html";

}


// USER TIDAK BISA POST
if(role === "user"){

  adminBox.style.display =
  "none";

}


// POST
window.addPost =
async function(){

  const text =
  document.getElementById("postInput").value;

  if(text === ""){

    alert("Isi post dulu!");

    return;

  }

  try{

    await addDoc(
      collection(db,"posts"),

      {

        user: username,

        text: text,

        likes: 0,

        comments: [],

        time: Date.now()

      }

    );

    alert("Post berhasil!");

    document.getElementById(
      "postInput"
    ).value = "";

  }

  catch(err){

    console.log(err);

    alert("Firebase error!");

  }

}


// LIKE
window.likePost =
async function(id, likes){

  const ref =
  doc(db,"posts",id);

  await updateDoc(ref,{

    likes: likes + 1

  });

}


// KOMENTAR
window.addComment =
async function(e,id){

  if(e.key === "Enter"){

    const text =
    e.target.value;

    if(text === "") return;

    const ref =
    doc(db,"posts",id);

    await updateDoc(ref,{

      comments: arrayUnion({

        user: username,

        text: text

      })

    });

    e.target.value = "";

  }

}


// REALTIME FEED
const q =
query(

  collection(db,"posts"),

  orderBy("time","desc")

);


onSnapshot(q,(snapshot)=>{

  feed.innerHTML = "";

  snapshot.forEach((docu)=>{

    const data =
    docu.data();

    const div =
    document.createElement("div");

    div.className = "post";

    div.innerHTML = `

      <div class="post-user">
        ${data.user}
      </div>

      <p>${data.text}</p>

      <div
      class="like"
      onclick="likePost('${docu.id}', ${data.likes})">

      ❤️ ${data.likes}

      </div>

      ${
        data.comments.map(c => `

        <div class="comment">

          <div class="comment-user">
            ${c.user}
          </div>

          ${c.text}

        </div>

        `).join("")
      }

      <input
      placeholder="Komentar..."
      onkeypress="addComment(event,'${docu.id}')"
      >

    `;

    feed.appendChild(div);

  });

});

</script>

</body>
</html>
